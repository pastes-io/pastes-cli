name: release

# Manual only. Bump "version" in package.json, push it, then run this.
# Tick dry-run to build, test, and pack without publishing — that is also the
# way to run the test suite on CI without cutting a release.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build, test, and pack, but do not publish or tag'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the git tag and GitHub release
      # Trusted publishing: npm exchanges this OIDC token for publish rights,
      # so there is no npm token stored anywhere in this repo.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check npm is new enough for trusted publishing
        run: |
          # Node 24 currently ships npm 11.13+, well past this floor. Assert it
          # so a runner image regression fails here with a clear message rather
          # than as a confusing auth error at publish time.
          required=11.5.1
          actual=$(npm -v)
          if [ "$(printf '%s\n%s\n' "$required" "$actual" | sort -V | head -1)" != "$required" ]; then
            echo "npm $actual is older than $required, which trusted publishing requires."
            npm install -g npm@latest
          fi
          echo "Using npm $(npm -v)"

      - id: meta
        name: Read the package being released
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $name@$version"

      - name: Fail early if this version is already on npm
        run: |
          name=${{ steps.meta.outputs.name }}
          version=${{ steps.meta.outputs.version }}
          # `npm view --json` prints its own 404 as a JSON object on stdout, so
          # neither its output nor its exit code distinguishes "not published"
          # from "published". Ask the registry instead: 200 means this exact
          # version exists, 404 means it does not.
          status=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$name/$version")
          case "$status" in
            404) echo "$name@$version is not on npm yet, proceeding." ;;
            200) echo "$name@$version is already published. Bump the version in package.json first."; exit 1 ;;
            # Never fall through to publish on an inconclusive answer.
            *)   echo "Unexpected registry response $status for $name@$version, aborting."; exit 1 ;;
          esac

      - run: npm install

      # `npm test` builds first, so this covers the compile too. Publishing an
      # unverified build is the one thing worth being slow about.
      - name: Build and test
        run: npm test
        env:
          # Tests spin up a local mock API; never let one launch a real browser.
          PASTES_NO_BROWSER: '1'

      - name: Pack and show exactly what will ship
        run: |
          npm pack
          echo "--- tarball contents ---"
          tar -tzf "${{ steps.meta.outputs.name }}-${{ steps.meta.outputs.version }}.tgz"

      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        # Authenticates via OIDC trusted publishing — no token. npm generates
        # provenance automatically in that mode, but passing --provenance
        # explicitly costs nothing and fails loudly if the attestation cannot
        # be produced, rather than silently publishing without one.
        run: npm publish --provenance --access public

      - name: Tag the release and attach the published tarball
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=${{ steps.meta.outputs.name }}
          version=${{ steps.meta.outputs.version }}
          gh release create "v$version" "$name-$version.tgz" \
            --title "v$version" \
            --generate-notes
